<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — ERSA</title>
<link rel="stylesheet" href="styles.css?v=20260920">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body>
<div class="auth-shell">
  <div class="hero-gradient"></div>
  <div class="auth-card">
    <div class="auth-mark"><iconify-icon icon="lucide:shield-check"></iconify-icon></div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to your ERSA Workbench.</p>

    <form id="login-form" autocomplete="on">
      <div class="auth-field">
        <label for="user-id-input">User ID</label>
        <input id="user-id-input" type="text" autocomplete="username" placeholder="e.g. jsmith" autofocus>
      </div>
      <div class="auth-field">
        <label for="password-input">Password</label>
        <div class="auth-input-wrap">
          <input id="password-input" type="password" data-pw-field autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="auth-toggle-visibility" data-toggle-for="password-input" title="Show password">
            <iconify-icon icon="lucide:eye"></iconify-icon>
          </button>
        </div>
      </div>
      <button type="submit" class="auth-submit" id="login-submit">Sign in</button>
      <p class="auth-error" id="login-error"></p>
    </form>

    <div class="auth-switch">New here? <a href="signup.html">Create an account</a></div>
    <div class="auth-note">
      Your account lives on the Workbench server; your password is stored only
      as a salted hash. Your User ID is your identity across chats and your
      Knowledge Base.
    </div>
  </div>
</div>

<script src="app.js?v=20260920"></script>
<script>
  if (UserAuth.isSessionActive()) location.replace('index.html');

  const form = document.getElementById('login-form');
  const userIdInput = document.getElementById('user-id-input');
  const passwordInput = document.getElementById('password-input');
  const errorEl = document.getElementById('login-error');

  document.querySelectorAll('.auth-toggle-visibility').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.toggleFor);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.querySelector('iconify-icon').setAttribute('icon', showing ? 'lucide:eye' : 'lucide:eye-off');
    });
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');
    const userId = userIdInput.value.trim();
    const password = passwordInput.value;
    if (!userId || !password) { showError('Enter your User ID and password.'); return; }

    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    try {
      // Verified server-side (app/api/auth.py) against a PBKDF2 hash, and
      // returns the bearer token every later API call is authenticated with.
      await UserAuth.login(userId, password);
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || 'index.html';
    } catch (err) {
      showError(err.message || 'Sign in failed.');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
